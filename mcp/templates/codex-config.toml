# ============================================================
# Codex config.toml template (generated by install.ps1)
# __VAR__ placeholders are replaced from secrets.env.
# Paths use <USER> as a literal placeholder for your Windows username.
# ============================================================
model_provider = "custom"
model = "deepseek-v4.1-flash"
model_reasoning_effort = "high"
model_catalog_json = "cc-switch-model-catalog.json"

approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.custom]
name = "opencode_go"
base_url = "http://127.0.0.1:15721/v1"
wire_api = "responses"
requires_openai_auth = true
experimental_bearer_token = "PROXY_MANAGED"

# ------------------------------------------------------------
# MCP servers
# ------------------------------------------------------------

# Read-only access to the test database (npx, no wrapper needed).
[mcp_servers.mysql]
type = "stdio"
command = "npx.cmd"
args = ["-y", "@benborla29/mcp-server-mysql"]

[mcp_servers.mysql.env]
MYSQL_HOST = "__MYSQL_HOST__"
MYSQL_PORT = "3306"
MYSQL_USER = "__MYSQL_USER__"
MYSQL_PASS = "__MYSQL_PASS__"
MYSQL_DB = "__MYSQL_DB__"
ALLOW_INSERT_OPERATION = "false"
ALLOW_UPDATE_OPERATION = "false"
ALLOW_DELETE_OPERATION = "false"

[mcp_servers.gitnexus]
command = 'C:\Users\<USER>\AppData\Roaming\npm\gitnexus.cmd'
args = ["mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

[mcp_servers.gitnexus.env]
GITNEXUS_MCP_READ_ONLY = "1"
GITNEXUS_MCP_DEFAULT_MAX_TOKENS = "8000"
GITNEXUS_FTS_CJK_SEGMENTATION = "bigram"

# Secrets come from the wrapper script / process env, not from this file.
[mcp_servers.mcp-obsidian]
command = 'C:\Users\<USER>\.mcp\mcp-obsidian.cmd'
env_vars = ["OBSIDIAN_API_KEY"]

# dev DB - NOTE: write + DDL enabled by the wrapper.
[mcp_servers.mysql-dev]
command = 'C:\Users\<USER>\.mcp\mysql-dev.cmd'
env_vars = ["MYSQL_DEV_PASS"]

# test DB - NOTE: write + DDL enabled by the wrapper.
[mcp_servers.mysql-test]
command = 'C:\Users\<USER>\.mcp\mysql-test.cmd'
env_vars = ["MYSQL_TEST_PASS"]

